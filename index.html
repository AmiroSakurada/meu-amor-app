<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Para a Karol ❤️</title>
  <meta name="description" content="Mensagens do Amiro pra você, Karol.">
  <meta name="theme-color" content="#ff2e63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meu Amor">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
  <div class="bg-photo" aria-hidden="true"></div>
  <div class="hearts-bg" id="hearts-bg" aria-hidden="true"></div>

  <main class="card">
    <div class="avatar-wrap">
      <img class="avatar" src="assets/icon-192.png" alt="Nós dois" width="88" height="88">
    </div>

    <h1 class="title">Pra você, <span>Karol</span></h1>
    <p class="subtitle">do seu Amiro</p>

    <div class="message-box">
      <p id="mensagem">"Aguardando a próxima mensagem..."</p>
    </div>

    <div class="timer">
      <span>próxima mensagem em</span>
      <div id="countdown">--:--:--</div>
    </div>

    <button class="btn" id="btnAtivar" type="button">Ativar notificações</button>
    <p class="hint">Assim as mensagens chegam no seu celular, mesmo com o app fechado</p>
    <p class="status" id="status" role="status"></p>

    <!-- LISTINHA -->
    <section class="listinha" aria-label="Nossa listinha">
      <h2 class="listinha-title">📝 Nossa listinha</h2>
      <p class="listinha-hint">Marquem o que já fizeram juntos</p>

      <form class="listinha-form" id="listinhaForm" autocomplete="off">
        <input
          type="text"
          id="listinhaInput"
          class="listinha-input"
          placeholder="Ex: jantar romântico, ver pôr do sol…"
          maxlength="200"
          required
        />
        <select id="listinhaAuthor" class="listinha-author" aria-label="Quem está escrevendo">
          <option value="Amiro">Amiro</option>
          <option value="Karol">Karol</option>
          <option value="nós">nós</option>
        </select>
        <button type="submit" class="listinha-add" aria-label="Adicionar">+</button>
      </form>

      <ul class="listinha-items" id="listinhaItems"></ul>
      <p class="listinha-empty" id="listinhaEmpty">Ainda vazio… adicionem o primeiro item 💕</p>
    </section>

    <section class="photos" aria-label="Nossas fotos">
      <figure>
        <img src="assets/photo-elaeeu.jpg" alt="Nós dois" loading="lazy">
      </figure>
      <figure>
        <img src="assets/photo-meudocinho.jpg" alt="Meu docinho" loading="lazy">
      </figure>
      <figure>
        <img src="assets/photo-nafesta.jpg" alt="Nossa polaroid" loading="lazy">
      </figure>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
